<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>三国名马竞技场</title>
    <link rel="stylesheet" href="game.css" />
    <script src="game.js"></script>
</head>

<body>
    <div id="horse1" class="horse standRight">
        <div class="rider">
            <div class="head">
            </div>
            <div class="body">
            </div>
        </div>
    </div>

    <div id="horse2" class="horse standRight">
        <div class="rider">
            <div class="head">
            </div>
            <div class="body">
            </div>
        </div>
    </div>

    <div id="horse3" class="horse standRight">
        <div class="rider">
            <div class="head">
            </div>
            <div class="body">
            </div>
        </div>
    </div>

    <div id="horse4" class="horse standRight">
        <div class="rider">
            <div class="head">
            </div>
            <div class="body">
            </div>
        </div>
    </div>

    <div class="track">
        <div id="startline">
        </div>

        <div class="inner">
            <button id="start">开始比赛</button>

            <div id="bet">
                <p>当前资金: <span id="funds">100</span> 金币</p>
                <label>投注金额</label>
                <input type="number" id="amount" value="0">
                <label>选择战马:</label>
                <select id="bethorse">
                    <option value="1">的卢</option>
                    <option value="2">赤兔</option>
                    <option value="3">爪黄飞电</option>
                    <option value="4">绝影</option>
                </select>
                <label>比赛圈数</label>
                <input type="number" id="num_lap" name="num_lap" value="1">
            </div>
            <img src="images/tree.png" class="tree" />
            <br>
            <table id="results">
                <thead>
                    <tr>
                        <th>名次</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>第一名</td>
                        <td class="result horse1"></td>
                    </tr>
                    <tr>
                        <td>第二名</td>
                        <td class="result horse2"></td>
                    </tr>
                    <tr>
                        <td>第三名</td>
                        <td class="result horse3"></td>
                    </tr>
                    <tr>
                        <td>第四名</td>
                        <td class="result horse4"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
